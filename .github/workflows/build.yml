on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build Firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('manifest-dir/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West Init
        uses: docker://zmkfirmware/zephyr-west-action-arm:latest
        id: west-init
        with:
          args: 'init "-l config"'

      - name: West Update
        uses: docker://zmkfirmware/zephyr-west-action-arm:latest
        id: west-update
        with:
          args: 'update'

      - name: West Config Zephyr Base
        uses: docker://zmkfirmware/zephyr-west-action-arm:latest
        id: west-config
        with:
          args: 'config --global zephyr.base-working-directory zmk/zephyr'

      - name: West Zephyr Export
        uses: docker://zmkfirmware/zephyr-west-action-arm:latest
        id: west-zephyr-export
        with:
          args: 'zephyr-export'

      - name: West Build (butterfly_air)
        uses: docker://zmkfirmware/zephyr-west-action-arm:latest
        id: west-build
        with:
          args: 'build -s zmk/app -b nice_nano_v2 -- -DSHIELD=butterfly_air -DZMK_CONFIG="${GITHUB_WORKSPACE}"'

      - name: Butterfly Air UF2 File
        if: ${{ always() }}
        run: |
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 butterfly_air_nice_nano_v2.uf2
          fi

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: '*.uf2'

name: Build Firmware

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Initialize West Workspace
        run: |
          if [ ! -d .west ]; then
            west init -l config
          fi
          west update
          west zephyr-export

      - name: Build Butterfly Air Firmware
        run: |
          west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=butterfly_air -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Prepare UF2 Artifact
        if: ${{ always() }}
        run: |
          if [ -f build/zephyr/zmk.uf2 ]; then
            cp build/zephyr/zmk.uf2 butterfly_air_nice_nano_v2.uf2
          fi

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: butterfly_air_firmware
          path: '*.uf2'
